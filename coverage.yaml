# MASVS automation coverage, machine-readable form. This file is the source of truth; the
# tables in README.md are generated from it by scripts/build.py.
#
# Control ids and statements: OWASP MASVS v2.1.0, CC BY-SA 4.0, OWASP Foundation.
# The automation, method and why fields are our own assessment.
# MASTG test counts live in mastg-tests.json, generated by scripts/mastg_counts.py.
standard: OWASP MASVS
version: 2.1.0
source: https://github.com/OWASP/masvs
licence: CC-BY-SA-4.0
updated: 2026-09-25

levels:
  automated: >-
    A tool can return PASS or FAIL for the whole control from the app package, with no human
    judgement.
  partial: >-
    Tools produce the evidence: candidates, captures, inventories. A person decides the
    verdict.
  manual: >-
    Tooling gives little useful evidence. The verdict comes from functional testing, document
    review or judgement.

summary:
  automated: 2
  partial: 18
  manual: 4
  total: 24

controls:
  - id: MASVS-STORAGE-1
    group: MASVS-STORAGE
    statement: "The app securely stores sensitive data."
    automation: partial
    method: "Manifest and plist review, keystore and keychain usage, then a dump of the app sandbox on a device we own."
    why: "Whether stored data is sensitive depends on what the app does with it."
  - id: MASVS-STORAGE-2
    group: MASVS-STORAGE
    statement: "The app prevents leakage of sensitive data."
    automation: partial
    method: "Backup flags statically, then log, cache and snapshot capture during a scripted walkthrough."
    why: "Logs and backups have to be exercised on a device, and a leak only counts if the data is sensitive."
  - id: MASVS-CRYPTO-1
    group: MASVS-CRYPTO
    statement: "The app employs current strong cryptography and uses it according to industry best practices."
    automation: partial
    method: "Static rules for broken ciphers, ECB mode, weak hashes, predictable randomness and static IVs, then review of each hit in context."
    why: "MD5 for a cache key is fine and for a password it is not. The call site decides."
  - id: MASVS-CRYPTO-2
    group: MASVS-CRYPTO
    statement: "The app performs key management according to industry best practices."
    automation: partial
    method: "Hardcoded key and secret scanning, then review of how keys are generated, stored and rotated."
    why: "Finding a hardcoded key is automatic. Judging the key lifecycle is not."
  - id: MASVS-AUTH-1
    group: MASVS-AUTH
    statement: "The app uses secure authentication and authorization protocols and follows the relevant best practices."
    automation: manual
    method: "Review of the token flow against endpoints you have authorised in writing."
    why: "Authentication is enforced on the server. The app package shows the client half at best."
  - id: MASVS-AUTH-2
    group: MASVS-AUTH
    statement: "The app performs local authentication securely according to the platform best practices."
    automation: partial
    method: "Static check of the biometric API and whether it is bound to a keystore key, then a bypass attempt on a device."
    why: "The API calls are visible. Whether they actually gate access needs a device."
  - id: MASVS-AUTH-3
    group: MASVS-AUTH
    statement: "The app secures sensitive operations with additional authentication."
    automation: manual
    method: "Walk through the high-value actions and check each one asks for step-up authentication."
    why: "Which operations are sensitive is a business question."
  - id: MASVS-NETWORK-1
    group: MASVS-NETWORK
    statement: "The app secures all network traffic according to the current best practices."
    automation: partial
    method: "Cleartext flags, network security config, iOS ATS exceptions and custom trust code statically, then observed TLS on a device."
    why: "Platform config is decidable. Custom certificate validation in app code often is not, and in a compiled Flutter snapshot it cannot be told apart from an ordinary TLS socket."
  - id: MASVS-NETWORK-2
    group: MASVS-NETWORK
    statement: "The app performs identity pinning for all remote endpoints under the developer's control."
    automation: partial
    method: "Static detection of the pinning implementation, then a bypass attempt to test it."
    why: "Pinning code can be found statically. Whether it holds needs an attempt to break it."
  - id: MASVS-PLATFORM-1
    group: MASVS-PLATFORM
    statement: "The app uses IPC mechanisms securely."
    automation: partial
    method: "Exported components, permission guards, PendingIntent mutability and URI grants statically, then crafted intents on a device."
    why: "An exported component is only a problem if what it exposes is sensitive."
  - id: MASVS-PLATFORM-2
    group: MASVS-PLATFORM
    statement: "The app uses WebViews securely."
    automation: partial
    method: "JavaScript bridges and channels, file access settings and legacy web views statically, then a check of what content each WebView loads."
    why: "A JavaScript bridge is only dangerous if the WebView loads content an attacker can influence."
  - id: MASVS-PLATFORM-3
    group: MASVS-PLATFORM
    statement: "The app uses the user interface securely."
    automation: partial
    method: "Secure flag and input types statically, then screenshot, clipboard and notification leakage on a device."
    why: "Which screens show sensitive data is a judgement, and leakage has to be observed."
  - id: MASVS-CODE-1
    group: MASVS-CODE
    statement: "The app requires an up-to-date platform version."
    automation: automated
    method: "Minimum and target SDK, iOS deployment target."
    why: "Declared values with a clear threshold."
  - id: MASVS-CODE-2
    group: MASVS-CODE
    statement: "The app has a mechanism for enforcing app updates."
    automation: manual
    method: "Check that a forced upgrade or remote version gate exists and works."
    why: "A forced update is a server-side policy that has to be seen working."
  - id: MASVS-CODE-3
    group: MASVS-CODE
    statement: "The app only uses software components without known vulnerabilities."
    automation: automated
    method: "Dependency and SBOM scan against known vulnerability databases."
    why: "Automated for the control as written. Whether a vulnerable function is reachable is a further, manual question."
  - id: MASVS-CODE-4
    group: MASVS-CODE
    statement: "The app validates and sanitizes all untrusted inputs."
    automation: partial
    method: "Static detection of injection sinks, then confirmation that each sink is reachable with outside input."
    why: "A sink is only a finding if untrusted input reaches it."
  - id: MASVS-RESILIENCE-1
    group: MASVS-RESILIENCE
    statement: "The app validates the integrity of the platform."
    automation: partial
    method: "Detect the root, jailbreak and attestation checks, then test on a rooted device whether they are real or decorative."
    why: "Finding the check is automatic. Whether it does anything needs a device."
  - id: MASVS-RESILIENCE-2
    group: MASVS-RESILIENCE
    statement: "The app implements anti-tampering mechanisms."
    automation: partial
    method: "Signature and checksum verification logic statically, then a repackaged build to see if it is caught."
    why: "Only a tampered build shows whether the check works."
  - id: MASVS-RESILIENCE-3
    group: MASVS-RESILIENCE
    statement: "The app implements anti-static analysis mechanisms."
    automation: partial
    method: "Obfuscation state, decompiled readability, and whether a symbol or mapping file shipped in the package."
    why: "Obfuscation can be detected, but how much it slows an attacker is a judgement."
  - id: MASVS-RESILIENCE-4
    group: MASVS-RESILIENCE
    statement: "The app implements anti-dynamic analysis techniques."
    automation: partial
    method: "Static detection of anti-debug and anti-instrumentation code, then attaching a debugger and Frida on a device we own."
    why: "Detecting the code is automatic. Whether it stops an attacker is a test, not a scan."
  - id: MASVS-PRIVACY-1
    group: MASVS-PRIVACY
    statement: "The app minimizes access to sensitive data and resources."
    automation: partial
    method: "Declared permissions against observed use, plus a third-party SDK and tracker inventory."
    why: "Whether a permission is needed depends on the feature it serves."
  - id: MASVS-PRIVACY-2
    group: MASVS-PRIVACY
    statement: "The app prevents identification of the user."
    automation: partial
    method: "Identifier use and device fingerprinting fields in captured traffic."
    why: "Tools can list identifiers. Whether they identify a person depends on how they are combined."
  - id: MASVS-PRIVACY-3
    group: MASVS-PRIVACY
    statement: "The app is transparent about data collection and usage."
    automation: partial
    method: "Tracker inventory and captured traffic, compared with the privacy policy and the store data safety declaration."
    why: "Tools show what leaves the device. Comparing that to what the app declares is reading, not scanning."
  - id: MASVS-PRIVACY-4
    group: MASVS-PRIVACY
    statement: "The app offers user control over their data."
    automation: manual
    method: "Functional review of deletion, export and consent withdrawal."
    why: "These are features to use and observe, not code to scan."

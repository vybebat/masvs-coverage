name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Fetch OWASP MASVS v2.1.0 for the statement check
        run: git clone --depth 1 --branch v2.1.0 https://github.com/OWASP/masvs.git /tmp/masvs
      - name: Data consistent, statements verbatim, README in sync
        run: python scripts/build.py --check --upstream /tmp/masvs
